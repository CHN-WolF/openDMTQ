<svg xmlns="http://www.w3.org/2000/svg" viewBox="-28 -28 956 929" width="956" height="929" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', Helvetica, Arial, sans-serif" role="img" aria-label="A live broadcast: once the owner turns broadcasts on for the server, on the Broadcasts page, and for the player, on the Players page, the game asks every 15 seconds on a phone and every 5 on a PC, with a notice in the answer at every change of a switch, and uploads a two-second MPEG-TS segment every two seconds; the Discord and Slack chats of the Notices page hear that the player is on air; a browser plays it with hls.js about ten seconds behind; switched off, the next upload gets a 403; ended in the game, the playlist ends and the recording is closed, and a past broadcast plays as a recording with its songs as chapters">
