<text x="24" y="100" font-size="12" fill="#aeb8c3" text-anchor="start" data-box="24,578">and for the player (Players page).</text>
<text x="14" y="136" font-size="12" font-weight="600" fill="#aeb8c3" text-anchor="start" data-box="14,886">Every 15 s on a phone, 5 s on a PC, while the game is on screen</text>
<path d="M150,168 L442,168" fill="none" stroke="#7b8794" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M449,168 L440.0,172.5 L440.0,163.5 Z" fill="#7b8794" data-tip="449,168"/>
<text x="300" y="161" font-size="12" fill="#aeb8c3" text-anchor="middle" data-box="156,444">GET /live/state</text>
