<text x="474" y="450" font-size="12" fill="#aeb8c3" text-anchor="start" data-box="474,728">chats of the Notices page</text>
<text x="474" y="467" font-size="12" fill="#aeb8c3" text-anchor="start" data-box="474,728">hear of it</text>
