<text x="300" y="211" font-size="12" fill="#aeb8c3" text-anchor="middle" data-box="156,444">and a notice at each change</text>
<text x="14" y="258" font-size="12" font-weight="600" fill="#aeb8c3" text-anchor="start" data-box="14,886">Every 2 s, while it is on</text>
