<text x="42" y="720.25" font-size="15" font-weight="600" fill="#eef2f6" text-anchor="start" data-box="42,568">Broadcasts</text>
<text x="42" y="739.25" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="42,568">what the player shows, through Windows' own video and sound encoders</text>
