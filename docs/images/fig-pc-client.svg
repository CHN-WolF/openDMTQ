<text x="28" y="115" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="28,582">user, no administrator rights. Run again: Open, Repair, Update, Uninstall</text>
<text x="28" y="132.5" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="28,582">(Windows' Apps removes it the same way)</text>
