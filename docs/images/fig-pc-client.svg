<svg xmlns="http://www.w3.org/2000/svg" viewBox="-28 -28 956 834" width="956" height="834" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', Helvetica, Arial, sans-serif" role="img" aria-label="The PC client's parts. The installer, opendmtq-pc-client-&lt;version&gt;-windows-x64-setup-&lt;address&gt;.exe, comes from the server's site, set up for that server, or from a release, and installs for one Windows user with no administrator rights; run again, it opens, repairs, updates or uninstalls the PC client, as Windows' Apps does. The launcher, Python and Tk with its menu down the left, signs in with a site account through client.php, downloads the server's app from /apk and keeps it up to date, sets the picture and the sound up, tests the connection to the server, saves a report, shows the player's records and opens MY PAGE by a one-time link, and starts the player; it takes its own updates from its server's /updates/ first, then from GitHub, only those the project signed, a delta package when it can. The player runs the server's app, the game's own 32-bit code: the arm32 runtime translates it with Dynarmic and gives it Linux's system calls on Windows, with a Java VM of its own; the game draws with OpenGL ES on ANGLE over Direct3D 11, through the upscalers and anti-aliasing, each frame paced to the display's refreshes at its highest rate; WASAPI plays its sound, mixed at 44,100 Hz, with a low buffer by default, and Media Foundation its videos. Its overlay, the bar with Sound, minimise, full screen and quit, the sound panel, the question before quitting, the notices and the FPS counter, is frosted glass in windows of its own. It sends the game's requests, downloads and broadcasts to the server as a phone does, its broadcasts made with Windows' own encoders">
<rect x="-28" y="-28" width="956" height="834" rx="16" fill="#11151a"/>
