<text x="28" y="220" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="28,582">Python and Tk, a menu down its left: signs in, keeps the server's app up to date,</text>
<text x="28" y="237.5" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="28,582">sets the picture and the sound up, tests the connection, saves a report, shows</text>
<text x="28" y="255" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="28,582">My records and MY PAGE by a one-time link, and starts the player. Its own updates:</text>
<text x="28" y="272.5" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="28,582">from its server first, then GitHub, only those the project signed; a delta when it can</text>
