<text x="42" y="665.5" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="42,568">the bar (Sound, minimise, full screen, quit), the sound panel, the question before</text>
<text x="42" y="683" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="42,568">quitting, notices, the FPS counter: frosted glass, in windows of their own</text>
