<text x="42" y="593.5" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="42,568">WASAPI, shared or exclusive, a low buffer by default; the game's sound mixed</text>
<text x="42" y="611" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="42,568">at 44,100 Hz, as on a phone; the videos through Media Foundation</text>
