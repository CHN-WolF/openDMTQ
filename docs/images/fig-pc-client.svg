<text x="42" y="374.25" font-size="15" font-weight="600" fill="#eef2f6" text-anchor="start" data-box="42,568">The server's app</text>
<text x="42" y="393.25" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="42,568">the game's own 32-bit ARM code: its requests and downloads</text>
<path d="M28,412 H570 L582,424 V476 H28 Z" fill="#1a1f25" stroke="#3a434d" stroke-width="1" stroke-linejoin="round"/>
<text x="42" y="430.5" font-size="15" font-weight="600" fill="#eef2f6" text-anchor="start" data-box="42,568">arm32 runtime</text>
<text x="42" y="449.5" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="42,568">Dynarmic translates the code as it runs; Linux's system calls on Windows;</text>
<text x="42" y="467" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="42,568">a Java VM of its own</text>
<path d="M28,484 H570 L582,496 V548 H28 Z" fill="#1a1f25" stroke="#3a434d" stroke-width="1" stroke-linejoin="round"/>
<text x="42" y="502.5" font-size="15" font-weight="600" fill="#eef2f6" text-anchor="start" data-box="42,568">Picture</text>
<text x="42" y="521.5" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="42,568">OpenGL ES on ANGLE over Direct3D 11; FSR 1 or NIS, CMAA 2 or SMAA;</text>
<text x="42" y="539" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="42,568">each frame paced to the display's refreshes, at its highest rate</text>
